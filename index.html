<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ON THE RECORD. — Vinyl Archive</title><style>
:root{--bg:#f5f2eb;--ink:#23211f;--muted:#79736b;--line:#d7d0c5;--accent:#8b382f;--card:#faf8f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}header{border-bottom:1px solid var(--line);padding:20px max(22px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:800;letter-spacing:-.055em;font-size:23px}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.nav{display:flex;gap:20px;flex-wrap:wrap}.nav button,.textbtn{background:none;border:0;padding:5px 0;color:var(--muted)}.nav button.active{color:var(--ink);border-bottom:1px solid var(--ink)}main{max-width:1140px;margin:auto;padding:46px 22px 100px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--ink);padding-bottom:30px}.hero h1{font-family:Georgia,serif;font-size:clamp(48px,9vw,112px);letter-spacing:-.07em;font-weight:400;line-height:.95;margin:20px 0}.sub{color:var(--muted);line-height:1.7}.btn{background:var(--ink);color:white;border:1px solid var(--ink);padding:13px 19px}.btn.alt{background:transparent;color:var(--ink)}.btn.danger{background:transparent;color:var(--accent);border-color:var(--accent)}.stats{display:flex;gap:40px;padding:27px 0 40px;flex-wrap:wrap}.stat strong{font-size:31px;font-weight:400;font-family:Georgia,serif}.stat div{margin-top:6px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 25px}.toolbar input,.toolbar select{border:1px solid var(--line);background:transparent;padding:12px;min-width:0}.toolbar input{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:27px 17px}.album{min-width:0;cursor:pointer}.cover{aspect-ratio:1;background:#ded8cd;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.placeholder{width:75%;aspect-ratio:1;border:1px solid #b2a99b;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#6f675c;gap:13px;text-align:center;padding:12px}.placeholder:before{content:'◉';font-size:64px;font-weight:100}.album h3{font-size:15px;margin:12px 0 5px;font-weight:600}.album p{font-size:12px;color:var(--muted);margin:0;line-height:1.6}.chip{font-size:10px;letter-spacing:.07em;border:1px solid var(--line);padding:4px 6px;display:inline-block;margin-top:8px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:20px 0;border-bottom:1px solid var(--line);padding-bottom:14px}.sectionhead h2{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:0}.empty{border:1px dashed var(--line);padding:70px 20px;text-align:center;color:var(--muted);line-height:1.8}.entries{display:grid;gap:0}.entry{display:flex;gap:17px;align-items:center;border-bottom:1px solid var(--line);padding:16px 0;cursor:pointer}.entry .cover{width:75px;flex:none}.entry .placeholder:before{font-size:20px}.entry .placeholder{gap:0;font-size:6px}.entry h3{margin:0 0 6px;font-size:16px}.entry p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.entry .date{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:12px}.panel{max-width:750px;margin:auto}.panel h2{font-family:Georgia,serif;font-size:40px;font-weight:400;margin:14px 0 28px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);padding:13px;border-radius:0;color:var(--ink)}.field textarea{min-height:105px;resize:vertical}.checkline{display:flex;gap:8px;align-items:center;margin:8px 0 23px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.detail{display:grid;grid-template-columns:minmax(220px,380px) 1fr;gap:42px}.detail .cover{width:100%}.detail h2{font:400 clamp(36px,5vw,64px)/1.04 Georgia,serif;letter-spacing:-.04em;margin:12px 0}.detail dl{display:grid;grid-template-columns:110px 1fr;gap:12px;font-size:13px;padding:25px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.detail dt{color:var(--muted)}.detail dd{margin:0}.note{white-space:pre-wrap;line-height:1.8}.back{margin-bottom:30px}.hint{font-size:12px;color:var(--muted);line-height:1.7}.footer{border-top:1px solid var(--line);padding:24px;max-width:1140px;margin:auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none!important}input[type=file]{max-width:100%}@media(max-width:750px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:23px 12px}.hero{display:block}.hero .btn{margin-top:20px}.detail{grid-template-columns:1fr;gap:22px}.detail>.cover{max-width:430px}.formgrid{grid-template-columns:1fr}.stats{gap:24px}.entry .date{font-size:10px}}
</style></head><body><header><div><div class="brand">ON THE RECORD<span style="color:var(--accent)">.</span></div><div class="eyebrow">A PERSONAL VINYL ARCHIVE</div></div><nav class="nav"><button data-tab="library" class="active">LIBRARY</button><button data-tab="journal">LISTENING LOG</button><button data-tab="favorites">FAVORITES</button><button data-tab="settings">SETTINGS</button></nav></header><main id="app"></main><footer class="footer"><span class="eyebrow">33⅓ RPM · KEEP LISTENING</span><span class="eyebrow">YOUR RECORDS, YOUR STORIES</span></footer><script>
'use strict';const KEY='on-the-record-v1';let state={records:[],listens:[]},tab='library',filter='',sort='newest',selected=null,editing=null;const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const today=()=>new Date().toLocaleDateString('en-CA');function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('저장 공간이 부족합니다. 이미지 용량을 줄이거나 JSON 백업을 해주세요.');return false}}try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.records)&&Array.isArray(x.listens))state=x}catch(e){}const find=id=>state.records.find(r=>r.id===id);const count=id=>state.listens.filter(l=>l.recordId===id).length;function cover(r){return `<div class="cover">${r?.cover?`<img src="${esc(r.cover)}" alt="${esc(r.title)} 앨범 커버">`:`<div class="placeholder"><small>VINYL RECORD</small></div>`}</div>`}function nav(t){tab=t;selected=null;editing=null;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));function stats(){return `<div class="stats"><div class="stat"><strong>${String(state.records.length).padStart(2,'0')}</strong><div class="eyebrow">RECORDS</div></div><div class="stat"><strong>${String(state.records.filter(r=>r.owned).length).padStart(2,'0')}</strong><div class="eyebrow">OWNED</div></div><div class="stat"><strong>${String(state.listens.length).padStart(2,'0')}</strong><div class="eyebrow">LISTENS</div></div><div class="stat"><strong>${String(state.records.filter(r=>r.favorite).length).padStart(2,'0')}</strong><div class="eyebrow">FAVORITES</div></div></div>`}function library(fav=false){let rs=state.records.filter(r=>(!fav||r.favorite)&&[r.title,r.artist,r.genre,r.year,r.tags].join(' ').toLowerCase().includes(filter.toLowerCase()));rs.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='artist'?a.artist.localeCompare(b.artist):sort==='played'?(state.listens.filter(l=>l.recordId===b.id).map(l=>l.date).sort().at(-1)||'').localeCompare(state.listens.filter(l=>l.recordId===a.id).map(l=>l.date).sort().at(-1)||''):b.createdAt.localeCompare(a.createdAt));return `<div class="hero"><div><div class="eyebrow">AN EVER-GROWING MUSIC COLLECTION</div><h1>${fav?'FAVORITES.':'THE LIBRARY.'}</h1><div class="sub">${fav?'The records worth returning to.':'Records collected, discovered, and played.'}</div></div><button class="btn" data-action="add">+ ADD RECORD</button></div>${stats()}<div class="sectionhead"><h2>${fav?'Loved records':'All records'}</h2><span class="eyebrow">${rs.length} ENTRIES</span></div><div class="toolbar"><input id="search" placeholder="Search albums, artists, genres..." value="${esc(filter)}"><select id="sort"><option value="newest">Recently added</option><option value="title">Album A–Z</option><option value="artist">Artist A–Z</option><option value="played">Recently played</option></select></div>${rs.length?`<div class="grid">${rs.map(r=>`<article class="album" data-open="${esc(r.id)}">${cover(r)}<h3>${esc(r.title)} ${r.favorite?'♥':''}</h3><p>${esc(r.artist)}${r.year?' · '+esc(r.year):''}</p><span class="chip">${r.owned?'OWNED':'LISTENED / DISCOVERED'}</span></article>`).join('')}</div>`:`<div class="empty">${state.records.length?'No matching records.':'아직 등록된 음반이 없어요.<br>첫 번째 LP를 기록해 보세요.'}</div>`}`}
function journal(){const ls=[...state.listens].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return `<div class="hero"><div><div class="eyebrow">THE SOUNDTRACK OF YOUR DAYS</div><h1>LISTENING LOG.</h1><div class="sub">A diary of every spin.</div></div><button class="btn" data-action="newlisten">+ LOG A LISTEN</button></div>${stats()}<div class="sectionhead"><h2>Listening history</h2><span class="eyebrow">${ls.length} SESSIONS</span></div>${ls.length?`<div class="entries">${ls.map(l=>{let r=find(l.recordId);return `<article class="entry" data-listen="${esc(l.id)}">${cover(r)}<div><h3>${esc(r?.title||'Deleted record')}</h3><p>${esc(r?.artist||'')} ${l.location?' · '+esc(l.location):''}</p><p>${esc(l.notes||l.tracks||'').slice(0,120)}</p></div><div class="date">${esc(l.date)}</div></article>`}).join('')}</div>`:'<div class="empty">감상 기록이 없어요.<br>음반을 듣고 오늘의 소리를 남겨 보세요.</div>'}`}
function recordForm(r={}){return `<div class="panel"><button class="textbtn back" data-action="back">← BACK</button><div class="eyebrow">CATALOGUE / RECORD DETAILS</div><h2>${r.id?'Edit record':'Add a record'}</h2><form id="recordForm"><div class="formgrid"><div class="field"><label>Album title *</label><input name="title" required maxlength="200" value="${esc(r.title||'')}"></div><div class="field"><label>Artist *</label><input name="artist" required maxlength="200" value="${esc(r.artist||'')}"></div><div class="field"><label>Release year</label><input name="year" type="number" min="1880" max="2100" value="${esc(r.year||'')}"></div><div class="field"><label>Genre</label><input name="genre" placeholder="Jazz, Soul, Electronic..." value="${esc(r.genre||'')}"></div></div><div class="field"><label>Album cover image (upload)</label><input name="coverFile" type="file" accept="image/*"><div class="hint">사진은 기기 안에 저장됩니다. 큰 이미지는 자동 축소돼요.</div></div><div class="field"><label>Or cover image URL (optional)</label><input name="coverUrl" type="url" placeholder="https://..." value="${r.cover?.startsWith('http')?esc(r.cover):''}"></div><div class="field"><label>Tags (comma-separated)</label><input name="tags" placeholder="late night, live, vibraphone" value="${esc(r.tags||'')}"></div><div class="field"><label>Record notes</label><textarea name="notes" placeholder="앨범 소개, 구매 이야기, 음반 정보...">${esc(r.notes||'')}</textarea></div><label class="checkline"><input name="owned" type="checkbox" ${r.owned?'checked':''}> I own this record / 소장 중</label><label class="checkline"><input name="favorite" type="checkbox" ${r.favorite?'checked':''}> ♥ Add to favorites</label><div class="actions"><button class="btn" type="submit">${r.id?'SAVE CHANGES':'SAVE RECORD'}</button><button class="btn alt" type="button" data-action="back">CANCEL</button></div></form></div>`}
function detail(r){let ls=state.listens.filter(l=>l.recordId===r.id).sort((a,b)=>b.date.localeCompare(a.date));return `<button class="textbtn back" data-action="back">← BACK TO LIBRARY</button><div class="detail">${cover(r)}<div><div class="eyebrow">${esc(r.genre||'VINYL RECORD')} / ${r.owned?'IN MY COLLECTION':'DISCOVERED'}</div><h2>${esc(r.title)}</h2><p class="sub">${esc(r.artist)} ${r.year?'· '+esc(r.year):''}</p><div class="actions"><button class="btn" data-action="listen" data-id="${esc(r.id)}">+ LOG A LISTEN</button><button class="btn alt" data-action="favorite" data-id="${esc(r.id)}">${r.favorite?'♥ FAVORITED':'♡ FAVORITE'}</button></div><dl><dt>OWNERSHIP</dt><dd>${r.owned?'Owned':'Not owned'}</dd><dt>GENRE</dt><dd>${esc(r.genre||'—')}</dd><dt>PLAY COUNT</dt><dd>${ls.length}</dd><dt>TAGS</dt><dd>${esc(r.tags||'—')}</dd></dl><p class="note">${esc(r.notes||'')}</p><div class="actions"><button class="textbtn" data-action="edit" data-id="${esc(r.id)}">EDIT RECORD ↗</button><button class="textbtn" data-action="delete" data-id="${esc(r.id)}">DELETE</button></div></div></div><div class="sectionhead" style="margin-top:55px"><h2>Listening notes</h2><span class="eyebrow">${ls.length} SESSIONS</span></div>${ls.length?`<div class="entries">${ls.map(l=>`<article class="entry" data-listen="${esc(l.id)}"><div><h3>${esc(l.date)} ${l.location?'· '+esc(l.location):''}</h3><p>${esc(l.tracks||'')}</p><p>${esc(l.notes||'')}</p></div><span class="date">EDIT ↗</span></article>`).join('')}</div>`:'<p class="sub">No listening notes yet.</p>'}`}
function listenForm(l={}){let id=l.recordId||selected||state.records[0]?.id;return `<div class="panel"><button class="textbtn back" data-action="back">← BACK</button><div class="eyebrow">LISTENING JOURNAL</div><h2>${l.id?'Edit listening note':'Log a listen'}</h2><form id="listenForm"><div class="field"><label>Record *</label><select name="recordId" required>${state.records.map(r=>`<option value="${esc(r.id)}" ${r.id===id?'selected':''}>${esc(r.artist)} — ${esc(r.title)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Date *</label><input name="date" type="date" required value="${esc(l.date||today())}"></div><div class="field"><label>Place / Mood</label><input name="location" placeholder="Home, LP bar, rainy evening..." value="${esc(l.location||'')}"></div></div><div class="field"><label>Favorite tracks</label><input name="tracks" placeholder="Barbados, Limehouse Blues..." value="${esc(l.tracks||'')}"></div><div class="field"><label>Listening notes</label><textarea name="notes" placeholder="오늘 들은 음악은 어땠나요?">${esc(l.notes||'')}</textarea></div><div class="actions"><button class="btn" type="submit">SAVE LISTENING NOTE</button>${l.id?`<button class="btn danger" type="button" data-action="deletelisten" data-id="${esc(l.id)}">DELETE NOTE</button>`:''}</div></form></div>`}
function settings(){return `<div class="panel"><div class="eyebrow">YOUR ARCHIVE / YOUR DATA</div><h2>Settings & backup</h2><p class="sub">기록은 현재 브라우저의 로컬 저장소에 보관됩니다. 다른 기기와 자동 동기화되지 않으니 정기적으로 백업해 주세요. 브라우저 데이터 삭제 시 기록이 사라질 수 있습니다.</p><div class="sectionhead"><h2>Export archive</h2></div><p class="hint">음반, 감상 기록, 업로드한 커버 이미지를 JSON 파일로 내보냅니다.</p><button class="btn" data-action="export">DOWNLOAD JSON BACKUP ↓</button><div class="sectionhead"><h2>Import archive</h2></div><p class="hint">이 앱에서 내보낸 JSON 파일을 복원합니다. 현재 데이터는 교체되므로 먼저 백업하세요.</p><input id="importFile" type="file" accept=".json,application/json"><div class="sectionhead"><h2>Reset</h2></div><button class="btn danger" data-action="reset">DELETE ALL LOCAL DATA</button></div>`}
function render(){if(editing?.type==='record')app.innerHTML=recordForm(editing.item);else if(editing?.type==='listen')app.innerHTML=listenForm(editing.item);else if(selected&&find(selected))app.innerHTML=detail(find(selected));else app.innerHTML=tab==='library'?library():tab==='favorites'?library(true):tab==='journal'?journal():settings();let s=document.getElementById('search');if(s){s.oninput=e=>{filter=e.target.value;const start=e.target.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(start,start)};document.getElementById('sort').value=sort;document.getElementById('sort').onchange=e=>{sort=e.target.value;render()}}}
async function imageData(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,700/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.75))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이미지를 열 수 없습니다.'))};img.src=url})}
app.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='recordForm'){let old=editing?.item||{},file=f.elements.coverFile.files[0],cover=old.cover||'';try{if(file)cover=await imageData(file);else if(d.get('coverUrl'))cover=String(d.get('coverUrl')).trim()}catch(err){alert(err.message);return}let r={id:old.id||uid(),createdAt:old.createdAt||new Date().toISOString(),title:String(d.get('title')).trim(),artist:String(d.get('artist')).trim(),year:String(d.get('year')||''),genre:String(d.get('genre')||'').trim(),tags:String(d.get('tags')||'').trim(),notes:String(d.get('notes')||'').trim(),owned:d.has('owned'),favorite:d.has('favorite'),cover};if(!r.title||!r.artist)return;state.records=old.id?state.records.map(x=>x.id===old.id?r:x):[r,...state.records];if(save()){editing=null;selected=r.id;render()}}else if(f.id==='listenForm'){let old=editing?.item||{},l={id:old.id||uid(),createdAt:old.createdAt||new Date().toISOString(),recordId:String(d.get('recordId')),date:String(d.get('date')),location:String(d.get('location')||'').trim(),tracks:String(d.get('tracks')||'').trim(),notes:String(d.get('notes')||'').trim()};if(!find(l.recordId))return alert('음반을 먼저 등록하세요.');state.listens=old.id?state.listens.map(x=>x.id===old.id?l:x):[l,...state.listens];if(save()){editing=null;selected=l.recordId;render()}}});app.addEventListener('click',e=>{let a=e.target.closest('[data-action]');if(a){let id=a.dataset.id;switch(a.dataset.action){case 'add':editing={type:'record',item:{}};selected=null;break;case 'back':editing=null;selected=null;break;case 'edit':editing={type:'record',item:{...find(id)}};break;case 'newlisten':if(!state.records.length){alert('먼저 음반을 하나 등록해 주세요.');editing={type:'record',item:{}}}else editing={type:'listen',item:{}};break;case 'listen':editing={type:'listen',item:{recordId:id}};break;case 'favorite':find(id).favorite=!find(id).favorite;save();break;case 'delete':if(confirm('이 음반과 관련 감상 기록을 모두 삭제할까요?')){state.records=state.records.filter(r=>r.id!==id);state.listens=state.listens.filter(l=>l.recordId!==id);selected=null;save()}break;case 'deletelisten':if(confirm('이 감상 기록을 삭제할까요?')){state.listens=state.listens.filter(l=>l.id!==id);editing=null;save()}break;case 'export':{let blob=new Blob([JSON.stringify({app:'on-the-record',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='on-the-record-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case 'reset':if(confirm('모든 음반과 감상 기록을 영구 삭제할까요?')&&confirm('정말 삭제하시겠습니까? 백업하지 않은 기록은 복구할 수 없습니다.')){state={records:[],listens:[]};save();selected=null;editing=null}break}render();window.scrollTo(0,0);return}let r=e.target.closest('[data-open]');if(r){selected=r.dataset.open;editing=null;render();window.scrollTo(0,0)}let l=e.target.closest('[data-listen]');if(l){let item=state.listens.find(x=>x.id===l.dataset.listen);if(item){editing={type:'listen',item:{...item}};render();window.scrollTo(0,0)}}});app.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.records)||!Array.isArray(x.listens)||x.records.some(r=>!r.id||typeof r.title!=='string'||typeof r.artist!=='string')||x.listens.some(l=>!l.id||!l.recordId||!l.date))throw Error('지원하지 않는 백업 파일입니다.');if(confirm(`현재 기록을 교체하고 ${x.records.length}개 음반, ${x.listens.length}개 감상 기록을 복원할까요?`)){let prev=state;state={records:x.records,listens:x.listens};if(!save())state=prev;else{alert('복원했습니다.');nav('library')}}}catch(err){alert('불러오기 실패: '+err.message)}});render();
</script></body></html>
